[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assuresoc"
version = "0.1.0"
description = "AI SOC copilot: raw security telemetry -> prioritised incidents -> response + compliance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
